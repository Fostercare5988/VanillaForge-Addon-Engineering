name: VanillaForge validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanillaforge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out VanillaForge
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python tools
        run: |
          python -m compileall -q tools tests

      - name: Validate upstream configuration JSON
        run: |
          python -m json.tool UPSTREAM_VERSIONS.json > /dev/null

      - name: Verify framework files
        run: |
          test -f VANILLAFORGE.md
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f servers/TEMPLATE.md
          test -f CLASSICAPI_MASTER_REFERENCE.md
          test -f ENGINE_REFERENCE.md
          test -f KNOWN_PATTERNS.md
          test -f UPSTREAM_VERSIONS.json
          test -f tools/vanillaforge_linter.py
          test -f tools/audit_addon.py
          test -f tools/check_upstream.py
          test -f tools/fetch_upstream_docs.py
          test -f tools/extract_framexml.py

      - name: Run VanillaForge regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
