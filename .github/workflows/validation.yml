name: VanillaForge validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanillaforge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out VanillaForge
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lupa (the game's Lua, for the tests)
        run: |
          python -m pip install lupa

      - name: Compile Python tools
        run: |
          python -m compileall -q tools tests

      - name: Validate upstream configuration JSON
        run: |
          python -m json.tool UPSTREAM_VERSIONS.json > /dev/null

      - name: Run VanillaForge regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
