name: Upstream dependency check

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 08:17 UTC. Odd minute avoids the busiest cron boundary.
    - cron: "17 8 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: vanillaforge-upstream-check
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Check out VanillaForge
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check upstream projects
        id: upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/check_upstream.py --verbose --no-fail-on-change

      - name: Create or update upstream review issue
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          CHANGED_COMPONENTS: ${{ steps.upstream.outputs.changed_components }}
        with:
          script: |
            const title = "Upstream dependency review required";
            const marker = "<!-- vanillaforge-upstream-watch -->";
            const changed = process.env.CHANGED_COMPONENTS || "unknown";

            const body = [
              marker,
              "## VanillaForge upstream change detected",
              "",
              `Changed component(s): **${changed}**`,
              "",
              "The scheduled upstream checker detected a version, commit, or tracked-file change.",
              "",
              "### Review procedure",
              "- Inspect the actual upstream diff and release notes.",
              "- Update `CLASSICAPI_MASTER_REFERENCE.md` only for verified ClassicAPI API/semantic changes.",
              "- Update `ENGINE_REFERENCE.md` only for verified non-ClassicAPI engine/DLL changes.",
              "- Update `VANILLAFORGE_SYSTEM_PROMPT.md` only if an engineering rule actually changes.",
              "- Update `vanillaforge_linter.py` only for high-confidence, machine-detectable rules.",
              "- After review, update `UPSTREAM_VERSIONS.json` to the reviewed version/SHA snapshot.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find(
              issue => !issue.pull_request &&
                       issue.title === title &&
                       issue.body &&
                       issue.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: []
              });
              core.info(`Created issue #${issue.number}`);
            }
